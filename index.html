<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Blooket Market - Reconstructed Layout</title>
    <style>
        /* Core Layout and Theme Setup */
        :root {
            --bg-sidebar: #a040a0;       /* Purple sidebar from your image */
            --bg-main-light: #b21e29;    /* Lighter red pattern color */
            --bg-main-dark: #8a141c;     /* Slightly darker red pattern color */
            --bg-card-selected: #0a4f8f; /* Blue highlighted pack border */
            --text-main: #ffffff;
            --token-gold: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            /* Precise alternating checkerboard pattern using CSS Gradients */
            background-color: var(--bg-main-light);
            background-image: 
                linear-gradient(45deg, var(--bg-main-dark) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--bg-main-dark) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, var(--bg-main-dark) 75%), 
                linear-gradient(-45deg, transparent 75%, var(--bg-main-dark) 75%);
            background-size: 80px 80px;
            background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
            
            font-family: 'Titan One', 'Arial Black', sans-serif; 
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Sidebar Navigation Layout */
        .sidebar {
            width: 200px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            box-shadow: 6px 0 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .brand-title {
            font-size: 40px;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.3);
        }

        .play-btn {
            background-color: #00bcd4;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 24px;
            text-decoration: none;
            margin-bottom: 30px;
            box-shadow: 0px 6px 0px #00838f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 2px 0px #00838f;
        }

        .nav-item {
            padding: 12px 18px;
            color: #f0f0f0;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
        }

        .nav-item.active {
            background-color: #ffffff;
            color: var(--bg-sidebar);
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        .sidebar-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 18px;
            color: rgba(255,255,255,0.7);
        }

        /* Main Workspace Content Layout */
        .market-area {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 56px;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }

        .top-right-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .profile-tag {
            background-color: #7b2cbf;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0px 4px 0px #5a189a;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .token-counter {
            background-color: #cc1144;
            border: 3px solid #ffcc00;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0px #800020;
        }

        .workspace-layout {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        .packs-grid {
            display: grid;
            grid-template-columns: repeat(3, 210px);
            gap: 25px;
        }

        .pack-wrapper {
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .pack-wrapper.highlighted {
            background-color: var(--bg-card-selected);
            outline: 4px solid #ffffff;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }

        .pack-image-holder {
            width: 190px;
            height: 210px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            text-align: center;
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.1);
        }

        #pack-spooky { background-color: #240046; }
        #pack-dog { background-color: #ff9f1c; }
        #pack-lunch { background-color: #7209b7; }
        #pack-bug { background-color: #2d6a4f; }
        #pack-pirate { background-color: #0077b6; }
        #pack-outback { background-color: #e65c00; }

        .price-tag {
            background-color: #0056b3;
            border: 2px solid #007bff;
            padding: 8px 24px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 85%;
            justify-content: center;
            box-shadow: 0 5px 0px #003366;
            transition: transform 0.1s;
        }

        .price-tag:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0px #003366;
        }

        .booth-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
        }

        .market-stall-graphic {
            width: 260px;
            height: 340px;
            background-color: #1a2a3a;
            border: 5px solid #2b4c7e;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
        }

        .stall-sign {
            position: absolute;
            top: -30px;
            background-color: #111;
            padding: 6px 25px;
            letter-spacing: 4px;
            font-size: 24px;
            border: 3px solid white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .shopkeeper-character {
            width: 100px;
            height: 100px;
            background-color: #ffb703;
            border-radius: 16px;
            border: 4px solid #fb8500;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 0px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- Left Hand Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand-title">Blooket</div>
        <a href="#" class="play-btn">▶ Play</a>
        <a href="#" class="nav-item">🗺️ Map</a>
        <a href="#" class="nav-item">🧳 Blooks</a>
        <a href="#" class="nav-item active">🏪 Market</a>
        <a href="#" class="nav-item">🔍 Discover</a>
        <a href="#" class="nav-item">🛠️ Set Creator</a>
        <a href="#" class="nav-item">📚 My Sets</a>
        <a href="#" class="nav-item">⭐ Favorites</a>
        <div class="sidebar-footer">
            <span>📄</span>
            <span>⚙️</span>
            <span>📊</span>
        </div>
    </div>

    <!-- Main Dynamic Content Workspace -->
    <div class="market-area">
        <div class="header-row">
            <h1 class="page-title">Market</h1>
            <div class="top-right-status">
                <div class="profile-tag">🐱 GrindingAcc12 ▾</div>
                <div class="token-counter">🪙 <span id="token-val">10</span></div>
            </div>
        </div>

        <div class="workspace-layout">
            <!-- Grid tracking individual box/pack components -->
            <div class="packs-grid">
                
                <div class="pack-wrapper highlighted">
                    <div class="pack-image-holder" id="pack-spooky">SPOOKY<br>PACK</div>
                    <div class="price-tag" onclick="buyPack(25)">🪙 25</div>
                </div>

                <div class="pack-wrapper">
